# ============================================================
#  TAPD Workbench - nginx 反向代理配置
#  作用: 443(HTTPS 自签) -> 8000(uvicorn)，80 跳转 443
#  放置: /etc/nginx/sites-available/tapd
#  启用: ln -sf /etc/nginx/sites-available/tapd /etc/nginx/sites-enabled/tapd
#         rm -f /etc/nginx/sites-enabled/default
#         nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;
    # 80 端口仅用于跳转（也可以直接放行 8000 兜底）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/tapd.crt;
    ssl_certificate_key /etc/nginx/ssl/tapd.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 应用是看板工具，附件/导出可能稍大
    client_max_body_size 50m;

    # WebSocket 支持（应用 /ws 端点用于多人协作锁广播）
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/tapd.access.log;
    error_log  /var/log/nginx/tapd.error.log;
}
