# ============================================================
#  TAPD Workbench - 开发环境 nginx 入口（8443 → 127.0.0.1:8001）
#  放置: /etc/nginx/sites-available/tapd-dev
#  启用: ln -sf /etc/nginx/sites-available/tapd-dev /etc/nginx/sites-enabled/tapd-dev
#  访问: https://123.207.252.195:8443 （云防火墙仅对办公网/VPN 出口放行）
# ============================================================
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/tapd.crt;
    ssl_certificate_key /etc/nginx/ssl/tapd.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    client_max_body_size 50m;

    location /ws {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
